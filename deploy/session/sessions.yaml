            # path to pass — --game= wants the .bin.
            - name: ZS1_GAME
              value: "/mnt/zs1/games/Dino Crisis (E) (Track 1) [SLES-02207].bin.ecm"
            # LibCrypt: the 16-bit key lives in subchannel Q of 32 sectors and no
            # .bin dump holds it, so the disc needs its .sbi and it must be the
            # same pressing. Named explicitly rather than left to the automatic
            # search, because games/ holds two of them — SLES_022.10.sbi is the
            # Italian release. The wrong file loads without complaint, patches
            # sectors the game never reads, and hangs exactly as if there were
            # none at all.
            - name: ZS1_SBI
              value: "/mnt/zs1/games/Dino Crisis (E) (Track 1) [SLES-02207].sbi"
            # Vulkan, not GL. Xvfb serves no NVIDIA GLX extension, so libglvnd
            # resolves OpenGL to libGLX_mesa and the 4060 never draws. Vulkan
            # does not go through GLX: the ICD in /etc/vulkan/icd.d is enough,
            # and the device comes up as the RTX 4060 with a real swapchain.
