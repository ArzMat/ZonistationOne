---
# ClusterIP only, on purpose. Reaching a session means `kubectl port-forward`,
# which needs cluster credentials — nothing is published to the LAN, and the
# read-only disc mounts stay unreachable from outside the cluster. Putting an
# Ingress in front of these is a separate decision that needs authentication
# first.
apiVersion: v1
kind: Service
metadata:
  name: zs1-acecombat
  namespace: zs1
spec:
  type: ClusterIP
  selector: { app: zs1-session, game: acecombat }
  ports:
    - { name: novnc, port: 6080, targetPort: 6080 }
    - { name: audio, port: 6081, targetPort: 6081 }
    - { name: webrtc, port: 6082, targetPort: 6082 }
---
apiVersion: v1
kind: Service
metadata:
  name: zs1-crash
  namespace: zs1
spec:
  type: ClusterIP
  selector: { app: zs1-session, game: crash }
  ports:
    - { name: novnc, port: 6080, targetPort: 6080 }
    - { name: audio, port: 6081, targetPort: 6081 }
    - { name: webrtc, port: 6082, targetPort: 6082 }
---
apiVersion: v1
kind: Service
metadata:
  name: zs1-dino
  namespace: zs1
spec:
  type: ClusterIP
  selector: { app: zs1-session, game: dino }
  ports:
    - { name: novnc, port: 6080, targetPort: 6080 }
    - { name: audio, port: 6081, targetPort: 6081 }
    - { name: webrtc, port: 6082, targetPort: 6082 }
