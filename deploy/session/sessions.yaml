# Two independent sessions, differing only in which disc they mount and which
# working directory they own. The image carries no game: ZS1_GAME picks it and
# ZS1_SESSION keeps the memory cards apart.
#
# Deployment rather than a bare Pod so a crashed emulator comes back, with
# strategy Recreate because two replicas would fight over the same session
# directory during a rollout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zs1-acecombat
  namespace: zs1
  labels: { app: zs1-session, game: acecombat }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: zs1-session, game: acecombat }
  template:
    metadata:
      labels: { app: zs1-session, game: acecombat }
    spec:
      runtimeClassName: nvidia
      # WebRTC media needs candidates the viewer can actually reach. Inside the
      # pod network every candidate is a 10.44.x.x address, which nothing outside
      # the cluster routes to, and the media is UDP so the Ingress does not carry
      # it either: the browser got the offer, tried every candidate, and sat on
      # "connecting" forever. On the node's network the candidates become the
      # node container's own 172.19.0.x, which the host reaches over the Docker
      # bridge.
      #
      # The cost is that ports are now the node's, so two sessions cannot share
      # one — hence the anti-affinity below. Three workers, two sessions.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app: zs1-session }
              topologyKey: kubernetes.io/hostname
      nodeSelector:
        node-role.kubernetes.io/worker: worker
      containers:
        - name: emulator
          image: zs1/session:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: ZS1_SESSION
              value: acecombat
            - name: ZS1_BIOS
              value: /mnt/zs1/roms/SCPH-7502.BIN
            - name: ZS1_GAME
              value: "/mnt/zs1/games/Ace Combat 2 (Europe).bin"
            # Vulkan, not GL. Xvfb serves no NVIDIA GLX extension, so libglvnd
            # resolves OpenGL to libGLX_mesa and the 4060 never draws. Vulkan
            # does not go through GLX: the ICD in /etc/vulkan/icd.d is enough,
            # and the device comes up as the RTX 4060 with a real swapchain.
            - name: ZS1_GFX
              value: vulkan
            # The emulator's own log otherwise goes only to the ImGui panels and
            # the per-category files under the session directory, leaving the
            # pod's stdout with nothing but the entrypoint's four lines. At INFO
            # this is init and state changes only — the per-field SPUCNT writes
            # that used to be 72% of it now sit at DEBUG.
            - name: ZS1_LOG_STDERR
              value: "1"
            # The relay lives on the host, not in the cluster: it has to sit on
            # an address the viewer can reach, and no address inside k3d is.
            # From a Secret, because the URI carries the TURN credential and a
            # committed credential is a committed credential. Create it with:
            #   kubectl create secret generic zs1-turn -n zs1 \
            #     --from-literal=uri="turn://zs1:<pass>@<host-lan-ip>:3478"
            # 12 Mbit/s is fine on a LAN and wrong across a WAN, and doubly
            # wrong through a Tailscale DERP relay: those are shared and promise
            # no bandwidth at all, so the excess does not drop, it queues — and
            # the queue lands on top of the round trip. 2.5 Mbit/s carries PS1
            # content at 50 fps comfortably; the source is 320x240 or 640x480
            # upscaled, which costs far less than the frame size suggests.
            # ZS1_WEBRTC_BITRATE_KBPS raises it again on a local network.
            - name: ZS1_WEBRTC_BITRATE_KBPS
              value: "2500"
            # Audio on the same WAN path: 20 ms Opus frames instead of 10 halve
            # the packet rate and the header overhead (116 kbit/s on the wire
            # instead of 136 for the same 96 kbit/s of payload) for 10 ms of
            # delay, small next to the ~110 ms the emulator buffers itself.
            # ZS1_WEBRTC_AUDIO_KBPS / _TYPE / _FEC are in webrtc_server.py.
            - name: ZS1_WEBRTC_AUDIO_FRAME_MS
              value: "20"
            - name: ZS1_WEBRTC_TURN_HOST
              valueFrom:
                secretKeyRef: { name: zs1-turn, key: host }
            - name: ZS1_WEBRTC_TURN_SECRET
              valueFrom:
                secretKeyRef: { name: zs1-turn, key: secret }
          ports:
            - { name: novnc, containerPort: 6080 }
            - { name: audio, containerPort: 6081 }
            - { name: webrtc, containerPort: 6082 }
          resources:
            # A CPU request makes the pod Burstable instead of BestEffort, so the
            # emulator, PulseAudio and the encoder get their share under node
            # contention instead of being the first to starve; starving them is
            # what turns into audio underruns and dropped audio buffers. No CPU
            # limit: CFS throttling would cut a field short mid-frame.
            requests:
              cpu: "1"
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - { name: roms,  mountPath: /mnt/zs1/roms,  readOnly: true }
            - { name: games, mountPath: /mnt/zs1/games, readOnly: true }
            - { name: data,  mountPath: /mnt/zs1/data }
      volumes:
        - name: roms
          persistentVolumeClaim: { claimName: roms, readOnly: true }
        - name: games
          persistentVolumeClaim: { claimName: games, readOnly: true }
        - name: data
          persistentVolumeClaim: { claimName: data }
---
