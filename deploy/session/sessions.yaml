apiVersion: apps/v1
kind: Deployment
metadata:
  name: zs1-dino
  namespace: zs1
  labels: { app: zs1-session, game: dino }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: zs1-session, game: dino }
  template:
    metadata:
      labels: { app: zs1-session, game: dino }
