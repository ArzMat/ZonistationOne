<!DOCTYPE html>
<meta charset="utf-8">
<title>ZoniStation One — WebRTC</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; height:100%; background:#08080a; color:#e8e8ea;
               font:13px/1.45 system-ui, sans-serif; }
  body { display:flex; flex-direction:column; }
  #wrap { flex:1; display:flex; align-items:center; justify-content:center; min-height:0; }
  video { max-width:100%; max-height:100%; background:#000; image-rendering:pixelated; }
  #bar { display:flex; gap:16px; align-items:center; flex-wrap:wrap;
         padding:8px 12px; background:#141418; border-top:1px solid #26262c; }
  button { background:#2a2a33; color:inherit; border:1px solid #3a3a45; border-radius:5px;
           padding:5px 12px; cursor:pointer; font:inherit; }
  button:hover { background:#34343f; }
  .stat { font-variant-numeric:tabular-nums; color:#9aa; }
  .stat b { color:#e8e8ea; font-weight:600; }
  #hint { color:#66666f; }
</style>

<div id="wrap"><video id="v" autoplay playsinline></video></div>

<div id="bar">
  <button id="go">Connect</button>
  <span class="stat" id="s-state">idle</span>
  <span class="stat" id="s-rtt"></span>
  <span class="stat" id="s-fps"></span>
  <span class="stat" id="s-br"></span>
  <span class="stat" id="s-jit"></span>
  <span class="stat" id="s-aud"></span>
  <span id="hint">Click the picture to send keys · arrows, Enter, Space, F5/F8</span>
</div>

<script>
// One transport for picture and sound, so they share a clock — the whole reason
// this exists next to the VNC page, where they did not.
// Two ways in, and the endpoint differs between them. Behind the Ingress there
// is one port for everything and the signalling socket is a path; with
// kubectl port-forward each service port is mapped separately and it is a port.
// ?sig= forces either (a bare number is a port, anything else a path).
// Where the signalling socket lives depends on how the page was reached, and
// that cannot be inferred from the port: the Ingress is published on 8081 here,
// not on 80, so "is this a standard port" gets it wrong. Rather than guess,
// try each candidate in turn — the path first, since that is the route that
// survives a pod restart — and keep the one that opens.
//
//   /ws            behind the Ingress: one port for everything, paths to split it
//   :6082          under kubectl port-forward: one local port per service port
//
// ?sig= pins it: a bare number is a port, anything else a path.
const SIG = new URLSearchParams(location.search).get('sig');
const WSPROTO = location.protocol === 'https:' ? 'wss://' : 'ws://';
const CANDIDATES = SIG
  ? [ /^\d+$/.test(SIG) ? WSPROTO + location.hostname + ':' + SIG
                        : WSPROTO + location.host + SIG ]
  : [ WSPROTO + location.host + '/ws',
      WSPROTO + location.hostname + ':6082' ];

const v = document.getElementById('v');
const go = document.getElementById('go');
const S = id => document.getElementById(id);

let pc = null, ws = null;
// Filled from the server's first message when a relay is configured. Without
// one the only candidates are on the cluster's Docker bridge, which no other
// device can route to.
let iceServers = [];

// Browser key names are not X keysyms, and xdotool speaks keysyms. Only the keys
// the emulator actually binds are mapped; anything else is dropped rather than
// guessed, so a stray browser shortcut cannot turn into a random keypress.
const KEYMAP = {
  ArrowUp:'Up', ArrowDown:'Down', ArrowLeft:'Left', ArrowRight:'Right',
  Enter:'Return', Space:'space', Escape:'Escape', Backspace:'BackSpace',
  Tab:'Tab', ShiftLeft:'Shift_L', ShiftRight:'Shift_R',
  ControlLeft:'Control_L', ControlRight:'Control_R',
  AltLeft:'Alt_L', AltRight:'Alt_R', Backquote:'grave',
};
for (let i = 0; i < 26; i++) KEYMAP['Key' + String.fromCharCode(65+i)] = String.fromCharCode(97+i);
for (let i = 0; i <= 9; i++) KEYMAP['Digit' + i] = String(i);
for (let i = 1; i <= 12; i++) KEYMAP['F' + i] = 'F' + i;

// Basic auth and WebSockets do not cooperate. The browser holds the credentials
// you typed for the page, but it does not attach them to a socket opened from
// JavaScript, so Traefik answers the handshake with 401 and the connection is
// closed before it opens — which surfaces as "signalling closed" with the page
// itself working perfectly. Credentials in the URL are the one thing a browser
// does send on a WebSocket handshake.
//
// They are asked for only after a socket has actually been refused, so a
// deployment without auth never sees a prompt, and kept in sessionStorage so it
// is once per tab rather than once per reconnect.
let candidate = 0;
let askedForCredentials = false;

function wsURL() {
  const base = CANDIDATES[candidate];
  const cred = sessionStorage.getItem('zs1cred');
  return cred ? base.replace(/^(wss?:\/\/)/, '$1' + cred + '@') : base;
}

// Ask for stereo Opus in the answer. libwebrtc (Chrome, Edge) decodes Opus as
// mono unless the answer's fmtp carries stereo=1
// (api/audio_codecs/opus/audio_decoder_opus.cc), and createAnswer() does not put
// it there; Firefox already does. The sender's sprop-stereo=1 is only a hint
// that it will send two channels (RFC 7587), so without this Chrome folded the
// SPU's stereo mix down to one channel.
function preferStereo(sdp) {
  const m = sdp.match(/a=rtpmap:(\d+) opus\/48000\/2/i);
  if (!m) return sdp;
  const pt = m[1];
  const fmtp = new RegExp('a=fmtp:' + pt + ' ([^\\r\\n]*)');
  if (fmtp.test(sdp))
    return sdp.replace(fmtp, (line, p) => /stereo=/.test(p) ? line
                                          : 'a=fmtp:' + pt + ' ' + p + ';stereo=1;sprop-stereo=1');
  return sdp.replace(m[0], m[0] + '\r\na=fmtp:' + pt + ' stereo=1;sprop-stereo=1');
}

function connect() {
  const opened = { yes: false };
  ws = new WebSocket(wsURL());
  ws.addEventListener('open', () => { opened.yes = true; });
  ws.addEventListener('close', () => {
    if (opened.yes) return;
    // Closed without ever opening. Either this candidate is not the right route,
    // or it is and the handshake was rejected — a browser will not attach the
    // credentials you typed for the page to a socket opened from JavaScript, so
    // Traefik answers 401. Exhaust the routes first, then ask once.
    if (candidate < CANDIDATES.length - 1) {
      candidate++;
      S('s-state').textContent = 'trying ' + CANDIDATES[candidate];
      connect();
    } else if (!askedForCredentials) {
      askedForCredentials = true;
      const u = prompt('Signalling needs the same user as the page:', 'zs1');
      if (u === null) return;
      const p = prompt('Password:');
      if (p === null) return;
      sessionStorage.setItem('zs1cred', encodeURIComponent(u) + ':' + encodeURIComponent(p));
      candidate = 0;
      S('s-state').textContent = 'retrying with credentials';
      connect();
    }
  });
  pc = new RTCPeerConnection({ iceServers: iceServers });

  pc.ontrack = e => { if (v.srcObject !== e.streams[0]) v.srcObject = e.streams[0]; };
  pc.onicecandidate = e => {
    if (e.candidate) ws.send(JSON.stringify({ ice: {
      candidate: e.candidate.candidate, sdpMLineIndex: e.candidate.sdpMLineIndex } }));
  };
  pc.onconnectionstatechange = () => {
    S('s-state').textContent = pc.connectionState;
    if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
      go.disabled = false; go.textContent = 'Reconnect';
    }
  };

  ws.onmessage = async ev => {
    const m = JSON.parse(ev.data);
    if (m.ice_servers) {
      iceServers = m.ice_servers;
      if (pc) pc.setConfiguration({ iceServers });
      S('s-state').textContent = 'relay configured';
    } else if (m.sdp) {
      await pc.setRemoteDescription(m.sdp);
      const created = await pc.createAnswer();
      const answer = { type: created.type, sdp: preferStereo(created.sdp) };
      await pc.setLocalDescription(answer);
      ws.send(JSON.stringify({ sdp: { type: answer.type, sdp: answer.sdp } }));
    } else if (m.ice) {
      try { await pc.addIceCandidate(m.ice); } catch (e) { /* late candidate */ }
    }
  };
  ws.onclose = () => { S('s-state').textContent = 'signalling closed';
                       go.disabled = false; go.textContent = 'Reconnect'; };
}

go.onclick = () => { go.disabled = true; go.textContent = 'Connecting'; connect(); };

// Keys only while the picture has focus, so the page's own controls still work.
v.tabIndex = 0;
v.addEventListener('click', () => v.focus());
function key(action, e) {
  const sym = KEYMAP[e.code];
  if (!sym || !ws || ws.readyState !== 1) return;
  e.preventDefault();
  ws.send(JSON.stringify({ key: { action, sym } }));
}
v.addEventListener('keydown', e => key('down', e));
v.addEventListener('keyup',   e => key('up', e));

// Reported, not estimated. round-trip time is the network leg only — encode and
// decode sit on top of it — but it is the part that a stat can actually prove.
let last = null, lastAud = null;
setInterval(async () => {
  if (!pc || pc.connectionState !== 'connected') return;
  const stats = await pc.getStats();
  let inb = null, aud = null, pair = null;
  stats.forEach(r => {
    if (r.type === 'inbound-rtp' && r.kind === 'video') inb = r;
    if (r.type === 'inbound-rtp' && r.kind === 'audio') aud = r;
    if (r.type === 'candidate-pair' && r.state === 'succeeded') pair = r;
  });
  // Audio: what reached the wire (payload + RTP headers), the receiver's average
  // jitter-buffer delay over the last second, the share of output that was
  // concealment rather than received audio, and whether it decodes in stereo.
  if (aud) {
    if (lastAud) {
      const dt = (aud.timestamp - lastAud.timestamp) / 1000;
      const bytes = (aud.bytesReceived - lastAud.bytesReceived) +
                    ((aud.headerBytesReceived || 0) - (lastAud.headerBytesReceived || 0));
      const emitted = (aud.jitterBufferEmittedCount || 0) - (lastAud.jitterBufferEmittedCount || 0);
      const jbMs = emitted > 0 ? ((aud.jitterBufferDelay - lastAud.jitterBufferDelay) / emitted) * 1000 : 0;
      const got = (aud.totalSamplesReceived || 0) - (lastAud.totalSamplesReceived || 0);
      const hid = (aud.concealedSamples || 0) - (lastAud.concealedSamples || 0);
      const codec = aud.codecId ? stats.get(aud.codecId) : null;
      const ch = codec && codec.channels ? (codec.channels === 2 ? 'stereo' : 'mono') : '?';
      if (dt > 0)
        S('s-aud').innerHTML = 'audio <b>' + (bytes * 8 / dt / 1e3).toFixed(0) + ' kbit/s</b> ' +
          'jb <b>' + jbMs.toFixed(0) + ' ms</b> ' +
          'plc <b>' + (got > 0 ? (100 * hid / got).toFixed(1) : '0.0') + '%</b> <b>' + ch + '</b>';
    }
    lastAud = aud;
  }
  if (pair && pair.currentRoundTripTime != null)
    S('s-rtt').innerHTML = 'rtt <b>' + (pair.currentRoundTripTime*1000).toFixed(0) + ' ms</b>';
  if (inb) {
    if (last) {
      const dt = (inb.timestamp - last.timestamp) / 1000;
      if (dt > 0) {
        S('s-fps').innerHTML = 'fps <b>' + ((inb.framesDecoded-last.framesDecoded)/dt).toFixed(0) + '</b>';
        S('s-br').innerHTML  = 'bitrate <b>' +
          (((inb.bytesReceived-last.bytesReceived)*8/dt/1e6)).toFixed(1) + ' Mbit/s</b>';
      }
    }
    S('s-jit').innerHTML = 'jitter <b>' + ((inb.jitter||0)*1000).toFixed(1) + ' ms</b>';
    last = inb;
  }
}, 1000);
</script>
